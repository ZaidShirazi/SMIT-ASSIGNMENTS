  <script>
  document.querySelectorAll('ul li').forEach((current_li, i) => {
    // Applying dynamic delay for all li
    current_li.style.animationDelay = ( 0.3 + (i * 0.10) ) + 's';

    /* the above loop works like this
      1st item: 0.3 + 0.0s = 0.3s total wait time
      2nd item: 0.3 + 0.1s = 0.4s total wait time
      3rd item: 0.3 + 0.2s = 0.5s total wait time
      4th item: 0.3 + 0.3s = 0.6s total wait time
      and so on...
    */
  });
