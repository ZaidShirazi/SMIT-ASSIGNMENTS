<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css" type="text/css" />
  <title>Digital Clock</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  
</head>

<body>
  
  <main>
    <h1>DIGITAL CLOCK</h1>
<!-- clock spans -->
    <div id="digitalClock">
        <span id="hourSpan">00</span> <span>:</span>
        <span id="minSpan">00</span> <span>:</span>
        <span id="secSpan">00</span>
        <span id="amPmSpan">AM</span>
    </div>

    <!-- DD MM DATE YY spans -->
    <div id="date-container">
        <span class="dateCon-span" id="daySpan">day</span>
        <span class="dateCon-span" id="monthSpan">month</span>
        <span class="dateCon-span" id="dateSpan">date</span>
        <span class="dateCon-span" id="yearSpan">year</span>
    </div>
  </main>
  
  <!-- Js File Connection -->
  <script src="./app.js"></script>
</body>

</html>
