<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSS FILE LINKING -->
    <link rel="stylesheet" href="./login.css" type="text/css" />

    <title>Login</title>
  </head>

  <body>

    <div id="main">
      <h1>Login</h1>

      <form id="login-Form">
        <div id="final-message"></div>
        <div class="credential-container">
          <input
            type="email"
            id="email-Inp"
            placeholder="Email Address*"
            autofocus
            autocomplete="off"
          />
          <small class="email-error"></small>
          <input
            type="password"
            id="password-Inp"
            placeholder="Password*"
            autocomplete="off"
          />
          <small class="password-error"></small>
        </div>

        <div id="loginInp-container">
          <input type="submit" value="Login" id="login-Inp" />
        </div>

        <p>Don't have an account? <a href="./index.html">SignUp</a></p>
      </form>
    </div>

    <!-- JS FILE LINKING -->
    <script defer type="module" src="./login.js"></script>
  </body>
</html>
