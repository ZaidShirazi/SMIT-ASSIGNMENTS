<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registeration Form</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="./app.js"></script>
  </head>

  <body>
    <form id="registerationForm">
      <legend>Registeration Form</legend>

      <div>
        <input
          type="email"
          id="emailInp"
          placeholder="Create email"
          autofocus
        />
      </div>

      <div>
        <input type="text" id="passwordInp" placeholder="Create password" />
      </div>

      <div>
        <input id="registerInp" type="submit" value="Register" />
      </div>

      <small></small>
    </form>
  </body>
</html>
